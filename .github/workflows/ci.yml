name: CI

# Section X.2 of the development guide. Runs on every push and PR:
#   1. EditMode tests (the pure-logic systems — engine, gearbox, A*, payout, save)
#   2. An Android build, so a broken build is caught on the commit that broke it
#
# Prerequisites, one-time setup:
#   - Add a repository secret UNITY_LICENSE with the contents of a Unity .ulf activation file
#     (personal licence: https://game.ci/docs/github/activation). Unity 6 Personal is free.
#   - Add UNITY_EMAIL and UNITY_PASSWORD secrets for a Pro/Plus serial, if you use one.
# Without those secrets the jobs will fail at the activation step — that is expected until
# someone with repo admin adds them.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref. Unity builds are slow and
  # there is no value in finishing a run for a commit nobody will look at again.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be a real editor version or every job fails instantly with "version not found".
  # Verified against https://unity.com/releases/editor/archive — there is no 6000.0.x in the
  # current archive; 6000.6 is the live stream. Core packages (URP) are pinned by Unity to
  # whatever editor version is used, so bumping this re-pins them automatically.
  # Version choice is constrained from both sides:
  #   - UUM-146005 (CLI builds fail with "script class layout is incompatible between the
  #     editor and the player") affects 6000.2 through 6000.6 and is fixed in 6000.7.0a6.
  #   - GameCI only publishes Docker images for release versions. Checked Docker Hub:
  #     unityci/editor has ZERO tags matching 6000.7, so the fixed stream cannot run here.
  # 6000.0.1f1 has an android image and is not on the issue's affected list. That is not a
  # guarantee it is unaffected, so treat this run as the experiment it is.
  UNITY_VERSION: 6000.0.1f1
  PROJECT_PATH: .

jobs:
  tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The Library folder is multi-gigabyte and takes ~15 min to regenerate from scratch.
      # Keying on the asset and package hashes means it is only rebuilt when it must be.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
          retention-days: 14

  build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Only build what passed its tests; an APK from broken logic is worse than no APK.
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Unity Android builds need more disk than the runner has free by default.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-android-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: Android
          # Development build: Unity generates a debug keystore, so CI needs no signing
          # secrets. A release AAB would need them.
          androidAppBundle: false
          buildName: TNLorrySimulator
          # Custom entry point, not the default build. It seeds the Phase 1 content and
          # generates the playable scenes *before* building — without that the APK would
          # contain no scenes at all and launch to a black screen.
          buildMethod: TNLorry.EditorTools.CiBuild.AndroidDevelopment

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TNLorrySimulator-apk
          path: build/Android
          retention-days: 14
